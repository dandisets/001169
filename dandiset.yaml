releaseNotes: "## Changes since version 0.260825.1909\n\nAll 23,033 session files
  were re-converted with the corrected conversion ([catalystneuro/constantinople-lab-to-nwb](https://github.com/catalystneuro/constantinople-lab-to-nwb),
  PR [#38](https://github.com/catalystneuro/constantinople-lab-to-nwb/pull/38), [issue
  #39](https://github.com/catalystneuro/constantinople-lab-to-nwb/issues/39)). The
  same sessions and file names are kept, except for one duplicate that was removed.\n
  \n**Corrections**\n\n- **Duplicate session.** The second copy of `sub-L011_ses-RWTautowait2-20221004-095612`
  (suffix `-x`) is removed.\n- **Catch probability.** The processed trials table now
  has `catch_percentage`.\n- **Subject weight.** 11,056 sessions now have the weight
  recorded for the session date, with its unit (for example `0.237 kg`).\n- **Date
  of birth.** The date of birth is now in the America/New_York time zone.\n- **Invalid
  times.** Times above one year are now stored as NaN in the trials, states, events
  and actions tables (2,028 values in 67 sessions).\n\n**Descriptions**\n\n- **Catch
  trials.** The descriptions of `is_catch` in the raw and processed trials tables
  now say what each one marks: the Bpod setting `IsCatch` in the raw table, a reward
  delay of 100 s in the processed table.\n- **Pre-initiation cue task.** `center_port_cue`
  is now described: it is true in the sessions of the pre-initiation cue task (Fig.
  5 of the paper), 762 sessions of 16 rats.\n- **Other columns.** The descriptions
  of `wait_time_threshold` and `training_stage` are rewritten.\n\n**Known gaps**\n
  \n- The dandiset holds only the sessions that pass the paper's inclusion criterion.\n
  - The subject age is a range (P6M/P24M) for 16 rats that have no date of birth in
  the lab's registry.\n- 360 sessions of 8 rats have a catch probability of 0.3, a
  value the paper does not list.\n- 456 sessions do not start with a mixed block,
  where the paper's Methods say every session did.\n- The protocol names `RWTautowait`
  (86 sessions of six rats) and `RWTautowaitWP` (5 sessions of one rat) are not described."
